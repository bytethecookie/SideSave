# Native Linux packages (.deb / .rpm), built with nfpm.
#
#   nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
#
# Expects the release build to have staged binaries in dist/ first. The
# desktop app links against the host's WebKitGTK, which is why the runtime
# dependencies below matter — a package that installs but won't launch is
# worse than no package.
name: sidesave
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: games
priority: optional
maintainer: bytethecookie <nick.cooke@gmail.com>
# Kept plain ASCII: package metadata is rendered by a lot of tools with a lot
# of encoding assumptions, and a mangled dash in `apt show` looks broken.
description: |
  Peer-to-peer save sync for non-Steam Steam shortcuts.
  Keeps save data in sync between your own machines for games added to Steam
  as a non-Steam shortcut - Steam Cloud doesn't cover those. No account, no
  server, no quota. Devices talk directly over the LAN, or through a relay
  when they are on different networks. Includes a headless daemon and CLI
  for servers and Steam Decks.
vendor: SideSave
homepage: https://github.com/bytethecookie/OpenSave
license: MIT

contents:
  - src: dist/sidesave
    dst: /usr/bin/sidesave
  - src: dist/sidesave-cli
    dst: /usr/bin/sidesave-cli
  - src: dist/sidesave-relay
    dst: /usr/bin/sidesave-relay

  - src: cmd/sidesave-app/build/linux/sidesave.desktop
    dst: /usr/share/applications/sidesave.desktop
  - src: cmd/sidesave-app/build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/sidesave.png

  - src: packaging/man/sidesave.1
    dst: /usr/share/man/man1/sidesave.1
    file_info:
      mode: 0644

  # Shell completions, installed where each shell already looks.
  - src: dist/completions/sidesave.bash
    dst: /usr/share/bash-completion/completions/sidesave
  - src: dist/completions/_sidesave
    dst: /usr/share/zsh/site-functions/_sidesave
  - src: dist/completions/sidesave.fish
    dst: /usr/share/fish/vendor_completions.d/sidesave.fish

  # A system-wide template for the user service. Users still enable it per
  # account with `systemctl --user enable --now sidesave-daemon`, since the
  # daemon runs as the logged-in user and reads their save files.
  # This is the NATIVE variant (ExecStart=/usr/bin/sidesave-cli); the Flatpak
  # ships the `flatpak run` one, which would fail here.
  - src: packaging/systemd/sidesave-daemon-native.service
    dst: /usr/lib/systemd/user/sidesave-daemon.service
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      # The desktop app is a WebKitGTK webview; without these it installs and
      # then fails to start.
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
    recommends:
      - xdg-utils
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3
    recommends:
      - xdg-utils
