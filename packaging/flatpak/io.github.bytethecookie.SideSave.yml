app-id: io.github.bytethecookie.SideSave
runtime: org.gnome.Platform
# GNOME runtime ships libwebkit2gtk-4.1 — the exact webview our Linux build
# links (wails -tags webkit2_41). This is what makes the app run on stock
# SteamOS, which does not ship WebKitGTK at all.
#
# 49 (freedesktop 25.08 base) matters for new handheld silicon: the 48
# runtime's Mesa predates the ROG Ally X-class APUs, and the webview died
# on GPU init there while the same app ran fine against the host's native
# Mesa. CI's ldd smoke test verifies webkit2gtk-4.1 is still present on
# every runtime bump.
runtime-version: "49"
sdk: org.gnome.Sdk
command: sidesave
rename-desktop-file: sidesave.desktop
rename-icon: sidesave

finish-args:
  # LAN peers, relay, cloud providers.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Game saves live throughout the user profile (AppData equivalents,
  # Documents, Steam userdata/compatdata); SD cards and external drives
  # mount under /run/media on SteamOS.
  - --filesystem=home
  - --filesystem=/run/media
  # Tray icon (StatusNotifier — KDE Plasma is the Steam Deck desktop).
  # Talking to the watcher is not enough: the app must also OWN its item
  # name on the bus. Inside a flatpak sandbox the app's PID is 2, and
  # fyne/systray names its item org.kde.StatusNotifierItem-<pid>-1 —
  # without this the tray fails with DBus ServiceUnknown (cosmetic, but
  # no tray icon).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1

modules:
  - name: sidesave
    buildsystem: simple
    build-commands:
      - install -Dm755 sidesave /app/bin/sidesave
      - install -Dm755 sidesave-cli /app/bin/sidesave-cli
      - install -Dm644 sidesave.png /app/share/icons/hicolor/512x512/apps/sidesave.png
      - install -Dm644 sidesave.desktop /app/share/applications/sidesave.desktop
      - install -Dm644 io.github.bytethecookie.SideSave.metainfo.xml /app/share/metainfo/io.github.bytethecookie.SideSave.metainfo.xml
    sources:
      # The stage/ dir holds the built binaries + assets, assembled by
      # whoever is packaging a release (originally CI; for this fork,
      # built and staged manually — see the fork's own build notes).
      - type: dir
        path: stage
